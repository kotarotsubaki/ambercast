name: docs

on:
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsdown.config.js'
      - '.github/workflows/docs.yml'
      - '.github/workflows/website-build.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/website-build.yml

  # Manual deploy of the current main tip (recovery after a failed release
  # deploy, or a docs-only change that should not wait for the next release).
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
