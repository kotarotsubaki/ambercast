name: pr-label

# pull_request_target grants fork PRs write access safely: checkout uses the base branch without a ref override.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

# PR assignment uses the Issues API, so label-write permission alone is insufficient.
permissions:
  pull-requests: write
  issues: write

jobs:
  label:
    # Skip Dependabot before execution because its pull_request token cannot write.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HAS_ASSIGNEE: ${{ github.event.pull_request.assignees[0] != null }}
        run: node scripts/lib/pr-labels.mjs
