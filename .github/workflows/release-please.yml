name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publishing runs as a follow-up job here (not on release.published):
  # releases created with GITHUB_TOKEN intentionally do not trigger other
  # workflows, so a separate release-triggered workflow would never fire.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing: npm authenticates this workflow directly,
      # no NPM_TOKEN secret is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 LTS bundles npm >= 11.5.1, the minimum for OIDC trusted
          # publishing, so no separate npm upgrade step is needed.
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-pack.mjs
      - run: npm publish

  build-website:
    # Only a push that created a release reaches here, and only after npm
    # publish succeeded, so the published site matches the npm release.
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
    uses: ./.github/workflows/website-build.yml

  deploy-website:
    needs: build-website
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
